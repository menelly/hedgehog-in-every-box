<!doctype html>
<!--
  🔭 The same desktop-app window as broken-planner.html, with the bugs from the test-drive fixed.
  Each fix is marked ✅. Sizes are in rem/em, so the fixes still hold with large text and at 200% zoom.
-->
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hedgehog Planner (fixed)</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 1rem; }
  /* ✅ controls-overlap: the corner Home button has its own corner; the rail's tabs start below it */
  .home { position: fixed; top: 0.5rem; left: 0.5rem; height: 2.5rem; z-index: 2; background: #345; color: #fff; border: 0; font: inherit; font-size: 0.8rem; padding: 0 0.6rem; }
  .rail { position: fixed; top: 0; left: 0; width: 8rem; height: 100dvh; background: #dde; display: flex; flex-direction: column; padding-top: 3.5rem; box-sizing: border-box; }
  .rail [role="tab"] { min-height: 2.75rem; border: 0; background: #ccd; margin-bottom: 0.25rem; font: inherit; text-align: right; padding-right: 0.6rem; }
  main { margin-left: 9rem; padding: 0.75rem 1rem; }
  /* ✅ shape-clipped-text: the label stops before the notch starts (padding-right measured in em, so it scales with the text) */
  .ribbon { display: inline-block; background: #b03a48; color: #fff; padding: 0.4em 1.6em 0.4em 0.6em; font-weight: 600; clip-path: polygon(0 0, 100% 0, 75% 50%, 100% 100%, 0 100%); }
  /* ✅ shape-clipped-text: the leaf gets its own room beside the heading, not on top of it */
  .flourished { position: relative; display: inline-block; margin: 1rem 0 0.5rem; font-size: 1.25rem; padding-right: 2.5em; }
  .flourished svg { position: absolute; right: 0; top: 0; width: 2em; height: 100%; pointer-events: none; }
  /* ✅ submit-above-options: the options first, the Export button after them */
  .export { height: 14rem; overflow: auto; border: 1px solid #999; padding: 0.5rem; width: 22rem; }
  .export label { display: block; margin-top: 0.5rem; }
  .preview { height: 30rem; background: repeating-linear-gradient(#fff, #fff 22px, #eef 22px, #eef 24px); }
  .export button { font: inherit; padding: 0.5rem 1rem; margin-top: 0.5rem; }
  .calibrator { position: relative; width: 320px; height: 160px; margin-top: 1rem; }
  .calibrator canvas { position: absolute; inset: 0; }
  .line { position: absolute; top: 0; bottom: 0; width: 24px; margin-left: -12px; cursor: ew-resize; background: rgba(176, 58, 72, 0.4); }
  /* ✅ drag-only-handle: a handle you can Tab to shows where focus is */
  .line:focus-visible { outline: 3px solid #4a8cff; }
  .nudge { margin-top: 0.5rem; }
  .toast { position: fixed; right: 1rem; bottom: 1rem; background: #222; color: #fff; padding: 0.6rem 0.9rem; border-radius: 6px; }
  /* ✅ message-off-screen: the theme changes the toast's COLOURS, never where it is */
  html[data-theme="midnight"] .toast { background: #111; outline: 1px solid #555; }
</style>
</head>
<body>
<button type="button" class="home" aria-label="Home">⌂ Home</button>
<nav class="rail" role="tablist" aria-label="Planner pages">
  <button type="button" role="tab" aria-selected="true">Monthly</button>
  <button type="button" role="tab" aria-selected="false">Weekly</button>
  <button type="button" role="tab" aria-selected="false">Daily</button>
</nav>
<main>
  <div class="ribbon" id="ribbon">Home</div>
  <br>
  <h2 class="flourished">Calendar settings<svg viewBox="0 0 40 24" aria-hidden="true"><ellipse cx="20" cy="12" rx="18" ry="10" fill="#4a7d4a"/></svg></h2>

  <section class="export" aria-label="Export">
    <label for="paper">Paper size</label>
    <select id="paper"><option>Letter</option><option>A4</option><option>A5</option></select>
    <label><input type="checkbox" id="notes"> Include notes pages</label>
    <label for="margin">Margin (mm)</label>
    <input id="margin" type="number" value="5">
    <div class="preview" aria-hidden="true"></div>
    <button type="button" id="export">Export</button>
  </section>

  <div>
    <div class="calibrator" id="calibrator">
      <canvas width="320" height="160"></canvas>
      <!-- ✅ drag-only-handle: Tab reaches it, and the arrow keys move it (Shift for bigger steps) -->
      <div class="line" id="line1" style="left: 107px" role="slider" tabindex="0" aria-label="Column line 1" aria-valuemin="0" aria-valuemax="320" aria-valuenow="107"></div>
    </div>
    <!-- ✅ drag-only-handle: or a number box beside it that nudges it -->
    <div class="calibrator" id="calibrator2">
      <canvas width="320" height="160"></canvas>
      <div class="line" id="line2" style="left: 213px" aria-controls="line2-at"></div>
    </div>
    <p class="nudge"><label for="line2-at">Column line 2 (px from the left)</label> <input id="line2-at" type="number" min="0" max="320" value="213"></p>
  </div>
</main>
<div class="toast" role="status">Exported ✓ planner.pdf</div>

<script>
  for (const cv of document.querySelectorAll('canvas')) {
    const c = cv.getContext('2d')
    c.strokeStyle = '#888'
    for (let x = 0; x <= 320; x += 320 / 3) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, 160); c.stroke() }
    for (let y = 0; y <= 160; y += 40) { c.beginPath(); c.moveTo(0, y); c.lineTo(320, y); c.stroke() }
  }

  const place = (line, px) => {
    px = Math.max(0, Math.min(320, Math.round(px)))
    line.style.left = px + 'px'
    if (line.getAttribute('role') === 'slider') line.setAttribute('aria-valuenow', String(px))
    if (line.id === 'line2') document.getElementById('line2-at').value = String(px)
  }
  for (const line of document.querySelectorAll('.line')) {
    // dragging still works, for the people it suits
    line.addEventListener('pointerdown', (e) => {
      line.setPointerCapture(e.pointerId)
      const box = line.parentElement.getBoundingClientRect()
      const move = (m) => place(line, m.clientX - box.left)
      line.addEventListener('pointermove', move)
      line.addEventListener('pointerup', () => line.removeEventListener('pointermove', move), { once: true })
    })
  }
  // ✅ drag-only-handle: arrow keys move it, one pixel at a time (ten with Shift)
  document.getElementById('line1').addEventListener('keydown', (e) => {
    const step = e.shiftKey ? 10 : 1
    const now = parseFloat(e.currentTarget.style.left)
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') place(e.currentTarget, now - step)
    else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') place(e.currentTarget, now + step)
    else return
    e.preventDefault()
  })
  document.getElementById('line2-at').addEventListener('input', (e) => place(document.getElementById('line2'), Number(e.target.value)))
</script>
</body>
</html>
